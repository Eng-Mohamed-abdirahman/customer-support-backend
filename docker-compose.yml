# One-command local stack: MongoDB + API + dashboard.
#   docker compose up --build
# Then create the first admin and open http://localhost:3000:
#   docker compose exec -e SEED_USER_EMAIL=admin@example.com -e SEED_USER_PASSWORD=change-me \
#     backend node dist/scripts/seed-super-admin.js
# AI, WhatsApp and storage keys are read from backend/.env when it exists.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/support-saas
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-before-deploying}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo-data:
  uploads:
